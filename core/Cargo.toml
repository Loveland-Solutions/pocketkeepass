[package]
name = "pocketkeepass-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "KeePass (KDBX) engine for PocketKeePass"
publish = false

[lib]
# "lib" for the Rust tests, "cdylib" for the shared library the Android app loads.
crate-type = ["lib", "cdylib"]

[features]
# Only for the binding generator below. The library itself never needs it.
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

# Generates the Kotlin side of the bridge from the compiled library. Gradle runs this.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

# Dependency rule (see ../CLAUDE.md): only current, maintained crates. The crypto primitives come
# from RustCrypto. Everything KeePass-specific (format, key handling, data model) is ours.
[dependencies]
aes = "0.9"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
chacha20 = "0.10"
flate2 = "1"
getrandom = "0.4"
hmac = "0.13"
quick-xml = "0.42"
salsa20 = "0.11"
sha2 = "0.11"
thiserror = "2"
twofish = "0.8"
uniffi = { version = "0.32", default-features = false }
zeroize = "1"
