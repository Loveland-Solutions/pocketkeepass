[package]
name = "pocketkeepass-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "KeePass (KDBX) engine for PocketKeePass"
publish = false

[lib]
# "lib" for the Rust tests, "cdylib" for the shared library the Android app loads.
crate-type = ["lib", "cdylib"]

[features]
# Only for the binding generator below. The library itself never needs it.
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

# Generates the Kotlin side of the bridge from the compiled library. Gradle runs this.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

# Dependency rule (see ../CLAUDE.md): only current, maintained crates. The crypto primitives come
# from RustCrypto. Everything KeePass-specific (format, key handling, data model) is ours.
[dependencies]
# "zeroize" on the ciphers: their key schedules are built from the master key, and are wiped
# when dropped instead of being left in freed memory.
aes = { version = "0.9", features = ["zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23"
cbc = { version = "0.2", features = ["alloc", "block-padding", "zeroize"] }
chacha20 = { version = "0.10", features = ["zeroize"] }
flate2 = "1"
getrandom = "0.4"
hmac = "0.13"
# Ed25519 passkeys made by KeePassXC and KeePassDX. From dalek-cryptography, not RustCrypto: RustCrypto
# has no Ed25519 signer of its own and points to this one (the owner agreed to it, 2026-11-18).
ed25519-dalek = { version = "3", features = ["pkcs8", "pem", "zeroize"] }
# P-256 ECDSA keys and signatures for passkeys (ES256), with PKCS#8 PEM for the KeePassXC format.
p256 = "0.14"
quick-xml = "0.42"
# RSA passkeys (RS256) made by KeePassXC. 0.10 fixes the Marvin timing advisory (RUSTSEC-2023-0071).
rsa = { version = "0.10", features = ["pkcs1v15"] }
salsa20 = { version = "0.11", features = ["zeroize"] }
# Passkey requests and responses are WebAuthn JSON from other apps, so the parser has to be robust.
serde_json = "1"
# SHA-1 only for TOTP codes, where RFC 6238 and nearly every service still use it.
sha1 = { version = "0.11", default-features = false }
sha2 = "0.11"
thiserror = "2"
twofish = { version = "0.8", features = ["zeroize"] }
uniffi = { version = "0.32", default-features = false }
zeroize = "1"
